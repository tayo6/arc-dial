name: Build Arc Dial

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:      # manual "Run workflow" button

permissions:
  contents: write         # needed to publish Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Creates go.sum on the first run; afterwards it's committed and this is a no-op
      - name: Resolve dependencies
        run: go mod tidy

      - name: Build
        run: wails build

      # tar.gz preserves the executable bit (plain zips sometimes don't)
      - name: Package
        run: tar -czf arc-dial-linux-amd64.tar.gz -C build/bin arc-dial

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arc-dial-linux-amd64
          path: arc-dial-linux-amd64.tar.gz
          if-no-files-found: error

      # Only runs when you push a tag like v0.1.0
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" arc-dial-linux-amd64.tar.gz \
            --title "Arc Dial ${GITHUB_REF_NAME}" --generate-notes