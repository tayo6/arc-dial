<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc Dial</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main>
      <h1>Arc Dial</h1>

      <svg
        id="dial"
        viewBox="0 0 200 200"
        role="slider"
        aria-label="Dial value"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        tabindex="0"
      >
        <defs>
          <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#f472b6" />
          </linearGradient>

          <filter id="soft">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Arc geometry (d) is generated by main.js from one set of constants -->
        <path id="trackArc" class="track" pathLength="100" />
        <path id="valueArc" class="value" pathLength="100" filter="url(#soft)" />

        <!-- Initial position = arc start point; main.js keeps it in sync -->
        <circle id="handle" class="handle" cx="43.431" cy="156.569" r="7" />

        <text id="valueLabel" class="label" x="100" y="108" text-anchor="middle">0</text>
        <text class="unit" x="100" y="130" text-anchor="middle">/ 100</text>
      </svg>

      <p>
        Drag the dial, click the arc, or use
        <kbd>←</kbd><kbd>→</kbd> <kbd>PgUp</kbd><kbd>PgDn</kbd> <kbd>Home</kbd><kbd>End</kbd>.
      </p>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
